version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: K9254490344k@
      MYSQL_DATABASE: api-gateway-security
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - micro-net

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - micro-net

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - micro-net

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    depends_on:
      - zookeeper
    networks:
      - micro-net

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1100:1025"
      - "8025:8025"
    networks:
      - micro-net

  eureka-server:
    build:
      context: ./Eureka-server-Registry-flightapp
    container_name: eureka-server
    ports:
      - "9997:9997"
    networks:
      - micro-net

  booking-service:
    build:
      context: ./booking-service-micro-assignment-1
    container_name: booking-service
    ports:
      - "9998:9998"
    depends_on:
      - eureka-server
      - mysql
      - kafka
    networks:
      - micro-net

  flight-service:
    build:
      context: ./flight-service-micro-assignment
    container_name: flight-service
    ports:
      - "9999:9999"
    depends_on:
      - eureka-server
      - mongodb
      - kafka
    networks:
      - micro-net

  api-gateway:
    build:
      context: ./api-gateway-assignment
    container_name: api-gateway
    ports:
      - "9996:9996"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - micro-net

networks:
  micro-net:
    driver: bridge
